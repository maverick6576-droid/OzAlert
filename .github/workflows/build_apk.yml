name: Compilar APK de Android (OzVisa Alert)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Permite compilar manualmente con un clic desde la pestaña "Actions" de GitHub

jobs:
  build-android-apk:
    name: Compilar APK Universal de Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦋 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependencias de Dart/Flutter
        run: flutter pub get

      - name: 🛠️ Compilar APK de Android en Modo Release
        run: flutter build apk --release

      - name: 📤 Subir archivo APK descargable a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: OzVisaAlert-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
