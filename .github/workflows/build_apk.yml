name: Compilar APK de Android (OzVisa Alert)

on:
  push:
    branches: [ main, feature/fase2 ]
  pull_request:
    branches: [ main, feature/fase2 ]
  workflow_dispatch: # Permite compilar manualmente con un clic desde la pestaña "Actions" de GitHub

jobs:
  build-android-apk:
    name: Compilar APK Universal de Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Configurar NDK preinstalado de Android
        run: |
          if [ -d "/usr/local/lib/android/sdk/ndk/27.0.12077973" ]; then
            echo "ANDROID_NDK_VERSION=27.0.12077973" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.0.12077973" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/27.0.12077973" >> $GITHUB_ENV
          elif [ -d "/usr/local/lib/android/sdk/ndk/26.3.11579264" ]; then
            echo "ANDROID_NDK_VERSION=26.3.11579264" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.3.11579264" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/26.3.11579264" >> $GITHUB_ENV
          fi

      - name: 🦋 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Instalar dependencias de Dart/Flutter
        run: flutter pub get

      - name: 🛠️ Compilar APK de Android en Modo Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: 📤 Subir archivo APK descargable a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: OzVisaAlert-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
