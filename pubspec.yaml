name: ozvisa_alert
description: "OzVisa Alert - Monitor Global en Tiempo Real de Visas de Australia MVP (3 Pantallas)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Firebase SDKs
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # RevenueCat Paywall SDK
  purchases_flutter: ^8.3.0

  # Local Push Notifications & Persistence
  flutter_local_notifications: ^17.2.3
  shared_preferences: ^2.3.2

  # RSS Parser & Networking
  http: ^1.2.2
  webfeed_plus: ^1.0.3
  url_launcher: ^6.3.0

  # UI, Typography & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

dependency_overrides:
  intl: ^0.20.0
